<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 16px;
    background: #ffffff;
    font-size: 13px;
    box-sizing: border-box;
  }
  .container {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }
  .box {
    border: 2px dashed #007ac2;
    padding: 14px;
    border-radius: 8px;
    background: #f4f8fb;
    width: 100%;
    box-sizing: border-box;
  }
  .btn {
    background: #007ac2;
    color: #fff;
    border: none;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    width: 100%;
    margin-top: 8px;
    font-size: 13px;
  }
  .btn:hover { background: #005a9e; }
  .btn-c { background: #28a745; margin-bottom: 12px; }
  .btn-c:hover { background: #218838; }
  textarea {
    width: 100%;
    height: 70px;
    font-family: monospace;
    font-size: 11px;
    box-sizing: border-box;
    margin-top: 4px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 6px;
    text-align: center;
    font-size: 12px;
  }
  th { background: #007ac2; color: #fff; }
  .cr { background: #fff3cd; font-weight: 700; }
</style>
</head>
<body>
<div class="container">
  <h3 style="margin:0 0 12px;color:#007ac2">Convertidor de JSON a KML y Listado de Vértices DMS (Aerocivil)</h3>
  
  <div class="box">
    <label><b>1. Carga el archivo .json descargado del visor:</b></label>
    <input type="file" id="fIn" accept=".json,.geojson,.txt" style="display:block;margin:8px 0">
    
    <label><b>O pega el contenido JSON aquí:</b></label>
    <textarea id="jTx" placeholder="Pega el JSON de Esri / GeoJSON aquí..."></textarea>
    
    <button class="btn" onclick="pProc()">2. Convertir, Descargar KML y Generar Coordenadas</button>
  </div>

  <div id="outS" style="display:none;margin-top:14px">
    <button class="btn btn-c" onclick="cCop()">Copiar Tabla de Coordenadas</button>
    <table>
      <thead>
        <tr><th>Vértice</th><th>Latitud</th><th>Longitud</th><th>Formato Salida</th></tr>
      </thead>
      <tbody id="tbB"></tbody>
    </table>
    <textarea id="tCop" style="position:absolute;left:-9999px"></textarea>
  </div>
</div>

<script>
function m2w(x,y){
  let l=(x/6378137)*(180/Math.PI);
  let a=(y/6378137)*(180/Math.PI);
  a=(180/Math.PI)*(2*Math.atan(Math.exp(a*(Math.PI/180)))-(Math.PI/2));
  return[l,a];
}
function eSH(c){
  let a=0;
  for(let i=0;i<c.length-1;i++) a+=(c[i+1][0]-c[i][0])*(c[i+1][1]+c[i][1]);
  return a>0;
}
function tDMS(v,isL){
  let d=isL?(v>=0?'N':'S'):(v>=0?'E':'W');
  let a=Math.abs(v),deg=Math.floor(a),mf=(a-deg)*60,m=Math.floor(mf),s=((mf-m)*60).toFixed(2);
  return deg+'°'+m+"'"+s+'"'+d;
}
function pProc(){
  let fi=document.getElementById('fIn'),jt=document.getElementById('jTx').value.trim();
  if(fi.files.length>0){
    let r=new FileReader();
    r.onload=e=>cKML(e.target.result,fi.files[0].name.replace(/\.[^/.]+$/,""));
    r.readAsText(fi.files[0]);
  }else if(jt!==''){
    cKML(jt,"vuelo_dron_pnnc");
  }else alert("Selecciona o pega un JSON.");
}
function cKML(jStr,nA){
  try{
    let d=JSON.parse(jStr),r=[];
    if(d.geometry&&d.geometry.rings)r=d.geometry.rings;
    else if(d.rings)r=d.rings;
    else if(Array.isArray(d)&&d[0]?.geometry?.rings)r=d[0].geometry.rings;
    else if(d.features&&d.features[0]?.geometry?.rings)r=d.features[0].geometry.rings;
    if(!r.length)return alert("Sin geometría de polígono válida.");
    let rc=r[0];
    if(eSH(rc))rc.reverse();
    let wC=rc.map(c=>Math.abs(c[0])>180?m2w(c[0],c[1]):[c[0],c[1]]),vU=[...wC],p1=vU[0],pU=vU[vU.length-1];
    if(p1[0]===pU[0]&&p1[1]===pU[1])vU.pop();
    let cK=[...vU,vU[0]],kStr=cK.map(p=>p[0]+','+p[1]+',0').join('\n');
    let kCon=`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${nA}</name><Style id="s"><LineStyle><color>ff0000ff</color><width>4</width></LineStyle><PolyStyle><fill>0</fill><outline>1</outline></PolyStyle></Style><Placemark><name>Poligono</name><styleUrl>#s</styleUrl><Polygon><outerBoundaryIs><LinearRing><coordinates>${kStr}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>`;
    let b=new Blob([kCon],{type:'application/vnd.google-earth.kml+xml'}),l=document.createElement('a');
    l.href=URL.createObjectURL(b);l.download=nA+'.kml';l.click();
    let tb=document.getElementById('tbB');tb.innerHTML='';
    let txt="Vértice\tLatitud\tLongitud\n";
    vU.forEach((pt,i)=>{
      let lat=tDMS(pt[1],1),lon=tDMS(pt[0],0),v='V'+(i+1),fmt=v+': '+lat+' '+lon;
      txt+=v+'\t'+lat+'\t'+lon+'\n';
      tb.innerHTML+=`<tr><td><b>${v}</b></td><td>${lat}</td><td>${lon}</td><td><code>${fmt}</code></td></tr>`;
    });
    let pI=vU[0],latC=tDMS(pI[1],1),lonC=tDMS(pI[0],0);
    txt+='V1\t'+latC+'\t'+lonC+'\n';
    tb.innerHTML+=`<tr class="cr"><td><b>V1 (Cierre)</b></td><td>${latC}</td><td>${lonC}</td><td><code>V1: ${latC} ${lonC}</code></td></tr>`;
    document.getElementById('tCop').value=txt;
    document.getElementById('outS').style.display='block';
  }catch(e){alert("Error al procesar el JSON.");}
}
function cCop(){
  let t=document.getElementById('tCop');
  t.select();
  document.execCommand('copy');
  alert('¡Coordenadas copiadas al portapapeles!');
}
</script>
</body>
</html>
