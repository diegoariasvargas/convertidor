<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Convertidor JSON a KML y Listado de Vértices DMS (Aerocivil)</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 12px; line-height: 1.4; color: #333; background-color: #fff; font-size: 13px; }
    .container { width: 100%; background: white; }
    .box { border: 2px dashed #007ac2; padding: 12px; border-radius: 6px; background: #f4f8fb; margin-bottom: 12px; }
    input[type="file"] { margin: 8px 0; display: block; width: 100%; }
    button { display: block; text-align: center; background-color: #007ac2; color: white; border: none; padding: 10px 18px; font-size: 13px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 6px; }
    button:hover { background-color: #005a9e; }
    textarea { width: 100%; height: 60px; margin-top: 6px; font-family: monospace; font-size: 11px; padding: 6px; }
    .output-section { margin-top: 12px; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; background: white; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: center; font-size: 12px; }
    th { background-color: #007ac2; color: white; }
    .btn-copy { background-color: #28a745; margin-bottom: 8px; font-size: 12px; }
    .btn-copy:hover { background-color: #218838; }
    .cierre-row { background-color: #fff3cd; font-weight: bold; }
    h3 { margin: 0 0 8px 0; color: #007ac2; font-size: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h3>Convertidor de JSON a KML y Listado de Vértices DMS (Aerocivil)</h3>
  
  <div class="box">
    <label><b>1. Carga el archivo .json descargado del visor:</b></label>
    <input type="file" id="fileInput" accept=".json,.geojson,.txt">
    
    <label><b>O pega el contenido JSON aquí:</b></label>
    <textarea id="jsonText" placeholder="Pega tu JSON de Esri / ArcGIS aquí..."></textarea>
    
    <button onclick="procesarYDescargar()">2. Convertir, Descargar KML y Generar Coordenadas</button>
  </div>

  <div id="outputSection" class="output-section">
    <button class="btn-copy" onclick="copiarCoordenadas()">Copiar Tabla de Coordenadas (DMS)</button>
    
    <table id="tablaVertices">
      <thead>
        <tr>
          <th>Vértice</th>
          <th>Latitud (N/S)</th>
          <th>Longitud (E/O)</th>
          <th>Texto Formateado</th>
        </tr>
      </thead>
      <tbody id="cuerpoTabla"></tbody>
    </table>
    
    <textarea id="textoParaCopiar" style="position: absolute; left: -9999px;"></textarea>
  </div>
</div>

<script>
  function mercatorToWgs84(x, y) {
    const lon = (x / 6378137.0) * (180 / Math.PI);
    let lat = (y / 6378137.0) * (180 / Math.PI);
    lat = (180 / Math.PI) * (2 * Math.atan(Math.exp(lat * (Math.PI / 180))) - (Math.PI / 2));
    return [lon, lat];
  }

  function esSentidoHorario(coords) {
    let area = 0;
    for (let i = 0; i < coords.length - 1; i++) {
      area += (coords[i+1][0] - coords[i][0]) * (coords[i+1][1] + coords[i][1]);
    }
    return area > 0;
  }

  function toDMS(val, isLat) {
    const dir = isLat ? (val >= 0 ? 'N' : 'S') : (val >= 0 ? 'E' : 'W');
    const absVal = Math.abs(val);
    const deg = Math.floor(absVal);
    const minFloat = (absVal - deg) * 60;
    const min = Math.floor(minFloat);
    const sec = ((minFloat - min) * 60).toFixed(2);
    return `${deg}°${min}'${sec}"${dir}`;
  }

  function procesarYDescargar() {
    const fileInput = document.getElementById('fileInput');
    const jsonText = document.getElementById('jsonText').value.trim();

    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        convertirAKml(e.target.result, file.name.replace(/\.[^/.]+$/, ""));
      };
      reader.readAsText(file);
    } else if (jsonText !== "") {
      convertirAKml(jsonText, "vuelo_dron_pnnc");
    } else {
      alert("Por favor selecciona un archivo JSON o pega el texto en el recuadro.");
    }
  }

  function ejecutarDescargarKML(kmlContent, fileName) {
    fetch('https://descargador-kml.vercel.app/api/descargar', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        kmlContent: kmlContent,
        fileName: fileName
      })
    })
    .then(response => response.blob())
    .then(blob => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `${fileName}.kml`;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    })
    .catch(error => {
      alert('Error al descargar el archivo KML.');
      console.error(error);
    });
  }

  function convertirAKml(jsonString, nombreArchivo) {
    try {
      const data = JSON.parse(jsonString);
      let rings = [];

      if (data.geometry && data.geometry.rings) {
        rings = data.geometry.rings;
      } else if (data.rings) {
        rings = data.rings;
      } else if (Array.isArray(data) && data[0] && data[0].geometry && data[0].geometry.rings) {
        rings = data[0].geometry.rings;
      } else if (data.features && data.features[0] && data.features[0].geometry && data.features[0].geometry.rings) {
        rings = data.features[0].geometry.rings;
      }

      if (rings.length === 0) {
        alert("No se encontraron geometrías de polígono válidas en el JSON.");
        return;
      }

      let rawCoords = rings[0];

      if (esSentidoHorario(rawCoords)) {
        rawCoords.reverse();
      }

      let wgsCoords = rawCoords.map(coord => {
        if (Math.abs(coord[0]) > 180) {
          return mercatorToWgs84(coord[0], coord[1]);
        }
        return [coord[0], coord[1]];
      });

      let verticesUnicos = [...wgsCoords];
      const p1 = verticesUnicos[0];
      const pUlt = verticesUnicos[verticesUnicos.length - 1];
      if (p1[0] === pUlt[0] && p1[1] === pUlt[1]) {
        verticesUnicos.pop();
      }

      let coordsParaKml = [...verticesUnicos, verticesUnicos[0]];

      let kmlCoordsStr = coordsParaKml.map(pt => `${pt[0]},${pt[1]},0`);
      const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>${nombreArchivo}</name>
    <Style id="estiloVueloDron">
      <LineStyle>
        <color>ff0000ff</color>
        <width>4</width>
      </LineStyle>
      <PolyStyle>
        <fill>0</fill>
        <outline>1</outline>
      </PolyStyle>
    </Style>
    <Placemark>
      <name>Poligono_de_Vuelo_Dron</name>
      <styleUrl>#estiloVueloDron</styleUrl>
      <Polygon>
        <outerBoundaryIs>
          <LinearRing>
            <coordinates>
              ${kmlCoordsStr.join('\n              ')}
            </coordinates>
          </LinearRing>
        </outerBoundaryIs>
      </Polygon>
    </Placemark>
  </Document>
</kml>`;

      ejecutarDescargarKML(kmlContent, nombreArchivo);

      const cuerpoTabla = document.getElementById('cuerpoTabla');
      cuerpoTabla.innerHTML = '';
      let textoCopiar = "Vértice\tLatitud\tLongitud\n";

      verticesUnicos.forEach((pt, idx) => {
        const latDMS = toDMS(pt[1], true);
        const lonDMS = toDMS(pt[0], false);
        const etiquetaVertice = `V${idx + 1}`;
        const textoFmt = `${etiquetaVertice}: ${latDMS} ${lonDMS}`;

        textoCopiar += `${etiquetaVertice}\t${latDMS}\t${lonDMS}\n`;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td><b>${etiquetaVertice}</b></td>
          <td>${latDMS}</td>
          <td>${lonDMS}</td>
          <td><code>${textoFmt}</code></td>
        `;
        cuerpoTabla.appendChild(row);
      });

      const ptInicial = verticesUnicos[0];
      const latDMS_cierre = toDMS(ptInicial[1], true);
      const lonDMS_cierre = toDMS(ptInicial[0], false);
      const etiquetaCierre = "V1 (Cierre)";
      const textoFmtCierre = `V1: ${latDMS_cierre} ${lonDMS_cierre}`;

      textoCopiar += `V1\t${latDMS_cierre}\t${lonDMS_cierre}\n`;

      const rowCierre = document.createElement('tr');
      rowCierre.className = 'cierre-row';
      rowCierre.innerHTML = `
        <td><b>${etiquetaCierre}</b></td>
        <td>${latDMS_cierre}</td>
        <td>${lonDMS_cierre}</td>
        <td><code>${textoFmtCierre}</code></td>
      `;
      cuerpoTabla.appendChild(rowCierre);

      document.getElementById('textoParaCopiar').value = textoCopiar;
      document.getElementById('outputSection').style.display = 'block';

    } catch (e) {
      alert("Error al procesar el archivo JSON.");
    }
  }

  function copiarCoordenadas() {
    const copyText = document.getElementById('textoParaCopiar');
    copyText.select();
    document.execCommand('copy');
    alert('¡Tabla de coordenadas copiada al portapapeles!');
  }
</script>

</body>
</html>
